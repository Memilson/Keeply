services:
  nginx:
    image: nginx:1.27-alpine
    container_name: keeply-nginx
    command:
      - /bin/sh
      - -c
      - |
        cat <<'EOF' >/etc/nginx/nginx.conf
        worker_processes auto;

        events {
          worker_connections 1024;
        }

        http {
          include /etc/nginx/mime.types;
          default_type application/octet-stream;

          log_format main '$$remote_addr - $$remote_user [$$time_local] "$$request" '
                          '$$status $$body_bytes_sent "$$http_referer" '
                          '"$$http_user_agent" "$$http_x_forwarded_for"';

          access_log /var/log/nginx/access.log main;
          sendfile on;
          keepalive_timeout 65;

          upstream keeply_landing {
            server landing:3000;
          }

          upstream keeply_frontend {
            server frontend:3000;
          }

          upstream keeply_backend {
            server backend:8080;
          }

          upstream keeply_minio {
            server minio:9000;
          }

          server {
            listen 80;
            server_name keeply.app.br;
            return 301 https://$$host$$request_uri;
          }

          server {
            listen 443 ssl http2;
            server_name keeply.app.br;

            ssl_certificate /etc/nginx/certs/fullchain.pem;
            ssl_certificate_key /etc/nginx/certs/privkey.pem;

            proxy_http_version 1.1;
            proxy_set_header Host $$host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_set_header X-Forwarded-Host $$host;

            location = /actuator/prometheus {
              return 404;
            }

            location = /api/actuator/prometheus {
              return 404;
            }

            location = /api/actuator/health {
              proxy_pass http://keeply_backend/actuator/health;
            }

            location /api {
              proxy_pass http://keeply_backend;
            }

            location = /prod {
              return 308 /prod/;
            }

            location /prod/ {
              proxy_pass http://keeply_frontend;
            }

            location = /minio {
              return 308 /minio/;
            }

            location /minio/ {
              client_max_body_size 0;
              proxy_request_buffering off;
              proxy_buffering off;
              proxy_read_timeout 3600s;
              proxy_send_timeout 3600s;
              proxy_connect_timeout 300s;
              proxy_set_header X-Forwarded-Prefix /minio;
              rewrite ^/minio/(.*) /$$1 break;
              proxy_pass http://keeply_minio;
            }

            location / {
              proxy_pass http://keeply_landing;
            }
          }
        }
        EOF
        exec nginx -g 'daemon off;'
    depends_on:
      landing:
        condition: service_started
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro

  landing:
    build:
      context: ..
      dockerfile: landing/Dockerfile
    container_name: keeply-landing
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 512m

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-https://keeply.app.br}
        NEXT_BASE_PATH: ${NEXT_BASE_PATH:-/prod}
    container_name: keeply-frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-https://keeply.app.br}
      NEXT_BASE_PATH: ${NEXT_BASE_PATH:-/prod}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_BASE_PATH:-/prod}
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: keeply-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KEEPLY_MINIO_ENDPOINT: http://minio:9000
      KEEPLY_MINIO_PUBLIC_ENDPOINT: ${KEEPLY_MINIO_PUBLIC_ENDPOINT:-https://keeply.app.br/minio}
      KEEPLY_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      KEEPLY_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      KEEPLY_MINIO_BUCKET: ${KEEPLY_MINIO_BUCKET:-keeply}
      KEEPLY_JWT_SECRET: ${KEEPLY_JWT_SECRET}
      KEEPLY_MASTER_KEY: ${KEEPLY_MASTER_KEY}
      KEEPLY_ALLOWED_ORIGINS: ${KEEPLY_ALLOWED_ORIGINS:-https://keeply.app.br}
      KEEPLY_TRUST_PROXY_HEADERS: ${KEEPLY_TRUST_PROXY_HEADERS:-true}
      KEEPLY_AI_BASE_URL: ${KEEPLY_AI_BASE_URL:-https://openrouter.ai/api/v1}
      KEEPLY_AI_MODEL: ${KEEPLY_AI_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      KEEPLY_AI_API_KEY: ${KEEPLY_AI_API_KEY:-}
      KEEPLY_AI_TITLE: ${KEEPLY_AI_TITLE:-Keeply}
      KEEPLY_AI_REFERER: ${KEEPLY_AI_REFERER:-https://keeply.app.br}
      KEEPLY_AI_TIMEOUT_SECONDS: ${KEEPLY_AI_TIMEOUT_SECONDS:-60}
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx768m"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g

  minio:
    image: minio/minio:latest
    container_name: keeply-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - keeply_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: keeply-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - keeply_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

volumes:
  keeply_postgres:
  keeply_minio:
