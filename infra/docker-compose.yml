services:
  postgres:
    image: postgres:16
    container_name: keeply-postgres
    environment:
      POSTGRES_DB: keeply
      POSTGRES_USER: keeply
      POSTGRES_PASSWORD: keeply123
    ports:
      - "5432:5432"
    volumes:
      - keeply_postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: keeply-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: keeply
      MINIO_ROOT_PASSWORD: keeply123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - keeply_minio:/data

volumes:
  keeply_postgres:
  keeply_minio:
