server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/keeply}
    username: ${SPRING_DATASOURCE_USERNAME:keeply}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.keeply: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

keeply:
  security:
    trust-proxy-headers: ${KEEPLY_TRUST_PROXY_HEADERS:false}
    trusted-proxy-ips: ${KEEPLY_TRUSTED_PROXY_IPS:}
    rate-limit:
      login:
        ip:
          max-attempts: ${KEEPLY_RATE_LOGIN_IP_MAX_ATTEMPTS:20}
        email:
          max-attempts: ${KEEPLY_RATE_LOGIN_EMAIL_MAX_ATTEMPTS:5}
      refresh:
        ip:
          max-attempts: ${KEEPLY_RATE_REFRESH_IP_MAX_ATTEMPTS:30}
  jwt:
    secret: ${KEEPLY_JWT_SECRET}
    expiration-minutes: 120
  minio:
    endpoint: ${KEEPLY_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${KEEPLY_MINIO_ACCESS_KEY:keeply}
    secret-key: ${KEEPLY_MINIO_SECRET_KEY}
    bucket: ${KEEPLY_MINIO_BUCKET:keeply}
  audit:
    workers: ${KEEPLY_AUDIT_WORKERS:4}
    queue-size: ${KEEPLY_AUDIT_QUEUE_SIZE:16}
