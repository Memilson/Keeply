server:
  port: 8080
  ssl:
    enabled: false
    key-store: classpath:keeply.p12
    key-store-password: keeply123
    key-store-type: PKCS12
    key-alias: keeply

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/keeply}
    username: ${SPRING_DATASOURCE_USERNAME:keeply}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  mvc:
    # VULN-004: timeout de requisição async para não bloquear threads em downloads grandes
    async:
      request-timeout: 300000 # 5 minutos

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.keeply: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

keeply:
  security:
    trust-proxy-headers: ${KEEPLY_TRUST_PROXY_HEADERS:false}
    trusted-proxy-ips: ${KEEPLY_TRUSTED_PROXY_IPS:}
    registration-code: ${KEEPLY_REGISTRATION_CODE:}
    # VULN-006: origins permitidos — configurar em produção via env var
    # Produção: KEEPLY_ALLOWED_ORIGINS=https://keeply.app.br,https://minio.keeply.app.br
    allowed-origins: ${KEEPLY_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
    rate-limit:
      login:
        ip:
          max-attempts: ${KEEPLY_RATE_LOGIN_IP_MAX_ATTEMPTS:5}
          window-minutes: ${KEEPLY_RATE_LOGIN_IP_WINDOW_MINUTES:15}
        email:
          max-attempts: ${KEEPLY_RATE_LOGIN_EMAIL_MAX_ATTEMPTS:5}
          window-minutes: ${KEEPLY_RATE_LOGIN_EMAIL_WINDOW_MINUTES:15}
      refresh:
        ip:
          max-attempts: ${KEEPLY_RATE_REFRESH_IP_MAX_ATTEMPTS:30}
      download:
        file:
          user:
            max-attempts: ${KEEPLY_RATE_DOWNLOAD_FILE_USER_MAX_ATTEMPTS:10}
            window-minutes: ${KEEPLY_RATE_DOWNLOAD_FILE_USER_WINDOW_MINUTES:5}
        archive:
          user:
            max-attempts: ${KEEPLY_RATE_DOWNLOAD_ARCHIVE_USER_MAX_ATTEMPTS:1}
            window-minutes: ${KEEPLY_RATE_DOWNLOAD_ARCHIVE_USER_WINDOW_MINUTES:10}
  jwt:
    secret: ${KEEPLY_JWT_SECRET}
    expiration-minutes: 120
  minio:
    endpoint: ${KEEPLY_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${KEEPLY_MINIO_ACCESS_KEY:keeply}
    secret-key: ${KEEPLY_MINIO_SECRET_KEY}
    bucket: ${KEEPLY_MINIO_BUCKET:keeply}
    # VULN-004: timeouts HTTP do cliente MinIO (evita thread starvation)
    connect-timeout-seconds: ${KEEPLY_MINIO_CONNECT_TIMEOUT_SECONDS:5}
    write-timeout-seconds: ${KEEPLY_MINIO_WRITE_TIMEOUT_SECONDS:30}
    read-timeout-seconds: ${KEEPLY_MINIO_READ_TIMEOUT_SECONDS:120}
  transfer:
    credentials:
      lifetime-minutes: ${KEEPLY_TRANSFER_CREDENTIAL_LIFETIME_MINUTES:10}
      renew-window-minutes: ${KEEPLY_TRANSFER_CREDENTIAL_RENEW_WINDOW_MINUTES:3}
  audit:
    workers: ${KEEPLY_AUDIT_WORKERS:4}
    queue-size: ${KEEPLY_AUDIT_QUEUE_SIZE:16}
  ai:
    base-url: ${KEEPLY_AI_BASE_URL:https://openrouter.ai/api/v1}
    model: ${KEEPLY_AI_MODEL:nvidia/nemotron-3-super-120b-a12b:free}
    api-key: ${KEEPLY_AI_API_KEY:}
    referer: ${KEEPLY_AI_REFERER:}
    title: ${KEEPLY_AI_TITLE:Keeply}
    timeout-seconds: ${KEEPLY_AI_TIMEOUT_SECONDS:60}
