services:
  minio:
    build: .
    container_name: keeply-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: keeply
      MINIO_ROOT_PASSWORD: keeply123456
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  create-bucket:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 keeply keeply123456;
      mc mb -p local/keeply || true;
      mc anonymous set none local/keeply || true;
      exit 0;
      "

volumes:
  minio_data:
