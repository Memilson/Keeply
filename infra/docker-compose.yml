services:
  postgres:
    image: postgres:16
    container_name: keeply-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keeply}
      POSTGRES_USER: ${POSTGRES_USER:-keeply}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keeply123}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - keeply_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keeply}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: keeply-postgres-exporter
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-keeply}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:-keeply}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:-keeply123}
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: keeply-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-keeply}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-keeply123}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - keeply_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: keeply-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-keeply}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-keeply}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-keeply123}
      KEEPLY_MINIO_ENDPOINT: http://minio:9000
      KEEPLY_MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      KEEPLY_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-keeply}
      KEEPLY_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-keeply123}
      KEEPLY_MINIO_BUCKET: ${KEEPLY_MINIO_BUCKET:-keeply}
      KEEPLY_JWT_SECRET: ${KEEPLY_JWT_SECRET:-dev-jwt-secret-change-me-32chars-min}
      KEEPLY_MASTER_KEY: ${KEEPLY_MASTER_KEY:-dev-master-key-change-me-64hex}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: keeply-frontend
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8080}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: keeply-prometheus
    command:
      - /bin/sh
      - -c
      - |
        cat <<'EOF' >/etc/prometheus/prometheus.yml
        global:
          scrape_interval: 15s
          evaluation_interval: 15s

        scrape_configs:
          - job_name: backend
            metrics_path: /actuator/prometheus
            static_configs:
              - targets:
                  - backend:8080

          - job_name: postgres-exporter
            static_configs:
              - targets:
                  - postgres-exporter:9187
        EOF
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --web.enable-lifecycle
    volumes:
      - keeply_prometheus:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - backend
      - postgres-exporter

  grafana:
    image: grafana/grafana:11.1.4
    container_name: keeply-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat <<'EOF' >/etc/grafana/provisioning/datasources/prometheus.yml
        apiVersion: 1
        datasources:
          - name: Prometheus
            uid: prometheus
            type: prometheus
            access: proxy
            url: http://prometheus:9090
            isDefault: true
            editable: false
        EOF
        exec /run.sh
    volumes:
      - keeply_grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus

volumes:
  keeply_postgres:
  keeply_minio:
  keeply_prometheus:
  keeply_grafana:
