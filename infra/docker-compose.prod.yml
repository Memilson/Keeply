services:
  nginx:
    image: nginx:1.27-alpine
    container_name: keeply-nginx
    command:
      - /bin/sh
      - -c
      - |
        cat <<'EOF' >/etc/nginx/nginx.conf
        worker_processes auto;

        events {
          worker_connections 1024;
        }

        http {
          include /etc/nginx/mime.types;
          default_type application/octet-stream;

          log_format main '$$remote_addr - $$remote_user [$$time_local] "$$request" '
                          '$$status $$body_bytes_sent "$$http_referer" '
                          '"$$http_user_agent" "$$http_x_forwarded_for"';

          access_log /var/log/nginx/access.log main;
          sendfile on;
          keepalive_timeout 65;

          upstream keeply_frontend {
            server frontend:3000;
          }

          upstream keeply_backend {
            server backend:8080;
          }

          upstream keeply_minio {
            server minio:9000;
          }

          server {
            listen 8081;
            server_name _;

            location /nginx_status {
              stub_status on;
              access_log off;
            }
          }

          server {
            listen 80;
            server_name keeply.app.br backend.keeply.app.br minio.keeply.app.br;
            return 301 https://$$host$$request_uri;
          }

          server {
            listen 443 ssl http2;
            server_name keeply.app.br;

            ssl_certificate /etc/nginx/certs/fullchain.pem;
            ssl_certificate_key /etc/nginx/certs/privkey.pem;

            location / {
              proxy_pass http://keeply_frontend;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
            }
          }

          server {
            listen 443 ssl http2;
            server_name backend.keeply.app.br;

            ssl_certificate /etc/nginx/certs/fullchain.pem;
            ssl_certificate_key /etc/nginx/certs/privkey.pem;

            location / {
              proxy_pass http://keeply_backend;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
            }
          }

          server {
            listen 443 ssl http2;
            server_name minio.keeply.app.br;

            ssl_certificate /etc/nginx/certs/fullchain.pem;
            ssl_certificate_key /etc/nginx/certs/privkey.pem;

            client_max_body_size 0;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            location / {
              proxy_pass http://keeply_minio;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
            }
          }
        }
        EOF
        exec nginx -g 'daemon off;'
    depends_on:
      - frontend
      - backend
      - minio
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: keeply-nginx-exporter
    command:
      - --nginx.scrape-uri=http://nginx:8081/nginx_status
    depends_on:
      - nginx

  postgres:
    image: postgres:16
    container_name: keeply-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - keeply_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: keeply-postgres-exporter
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: keeply-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - keeply_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: keeply-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KEEPLY_MINIO_ENDPOINT: http://minio:9000
      KEEPLY_MINIO_PUBLIC_ENDPOINT: ${KEEPLY_MINIO_PUBLIC_ENDPOINT}
      KEEPLY_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      KEEPLY_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      KEEPLY_MINIO_BUCKET: ${KEEPLY_MINIO_BUCKET}
      KEEPLY_JWT_SECRET: ${KEEPLY_JWT_SECRET}
      KEEPLY_MASTER_KEY: ${KEEPLY_MASTER_KEY}
      KEEPLY_TRUST_PROXY_HEADERS: ${KEEPLY_TRUST_PROXY_HEADERS:-true}
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx768m"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: keeply-frontend
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE}
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 512m

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: keeply-prometheus
    command:
      - /bin/sh
      - -c
      - |
        cat <<'EOF' >/etc/prometheus/prometheus.yml
        global:
          scrape_interval: 15s
          evaluation_interval: 15s

        scrape_configs:
          - job_name: backend
            metrics_path: /actuator/prometheus
            static_configs:
              - targets:
                  - backend:8080

          - job_name: postgres-exporter
            static_configs:
              - targets:
                  - postgres-exporter:9187

          - job_name: nginx-exporter
            static_configs:
              - targets:
                  - nginx-exporter:9113
        EOF
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --web.enable-lifecycle
    volumes:
      - keeply_prometheus:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - backend
      - postgres-exporter
      - nginx-exporter

  grafana:
    image: grafana/grafana:11.1.4
    container_name: keeply-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    deploy:
      resources:
        limits:
          memory: 256m
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat <<'EOF' >/etc/grafana/provisioning/datasources/prometheus.yml
        apiVersion: 1
        datasources:
          - name: Prometheus
            uid: prometheus
            type: prometheus
            access: proxy
            url: http://prometheus:9090
            isDefault: true
            editable: false
        EOF
        exec /run.sh
    volumes:
      - keeply_grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus

volumes:
  keeply_postgres:
  keeply_minio:
  keeply_prometheus:
  keeply_grafana:
