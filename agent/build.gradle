plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.17.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2'
    implementation 'com.cronutils:cron-utils:9.2.1'
    implementation 'org.xerial:sqlite-jdbc:3.49.1.0'
    
    // Security & Keyring
    implementation 'com.github.javakeyring:java-keyring:1.0.2'
    implementation 'net.java.dev.jna:jna:5.14.0'
    implementation 'net.java.dev.jna:jna-platform:5.14.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.3'
}

application {
    mainClass = 'com.keeply.agent.KeeplyAgentApp'
}

// Configura o diretório de trabalho para a tarefa 'run' padrão (GUI)
tasks.named('run') {
    workingDir = rootProject.projectDir
}

javafx {
    version = '25'
    modules = [ 'javafx.controls' ]
}

tasks.register('runDaemon', JavaExec) {
    group = 'application'
    description = 'Executa o daemon headless do Keeply Agent'
    workingDir = rootProject.projectDir // Garante que o diretório de trabalho seja a raiz
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.keeply.agent.KeeplyAgentDaemonApp'
    if (project.hasProperty('daemonArgs')) {
        args(project.property('daemonArgs').toString().split('\\s+'))
    }
}

tasks.register('daemonStartScripts', CreateStartScripts) {
    mainClass = 'com.keeply.agent.KeeplyAgentDaemonApp'
    applicationName = 'keeply-agent-daemon'
    classpath = files(tasks.named('jar').flatMap { it.archiveFile }, configurations.runtimeClasspath)
    outputDir = file("$buildDir/daemon/bin")
}
